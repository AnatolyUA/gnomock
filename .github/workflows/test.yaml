name: Test
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: "[core] lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=10m
      - name: Vet for arm64
        run: GOARCH=arm64 go vet ./...

  test-core:
    name: "[core] gnomock, gnomockd (go ${{ matrix.go }})"
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Get dependencies
        run: go mod download
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Gnomock
        run: task test:core:gnomock
      - name: Test gnomockd
        run: task test:core:gnomockd
      - name: Test internal
        run: task test:core:internal

  test-arm64:
    name: "[arm64] core, postgres, mysql, redis, mongo"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Gnomock
        run: task test:core:gnomock
      - name: Test gnomockd
        run: task test:core:gnomockd
      - name: Test internal
        run: task test:core:internal
      - name: Test presets
        run: go test -race -v ./preset/postgres/... ./preset/mysql/... ./preset/redis/... ./preset/mongo/...
      - name: Test server
        run: go test -race -v ./internal/gnomockd -run '^(TestPostgres|TestMySQL|TestRedis|TestMongo)'

  test-github-action:
    name: "[core] github action"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build orlangure/gnomock image
        run: task gnomock:build:server
      - name: Start Gnomock server
        uses: gnomock/github-action@master
      - name: Test Gnomock connection
        run: curl localhost:23042/stop -d '{"id":"42"}'

  test-service-containers:
    name: "[core] service container"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build orlangure/gnomock image
        run: task gnomock:build:server
      # A job's `services:` start before its steps and can't use an image built
      # in the job, so start the container the way a service container runs.
      - name: Start Gnomock server
        run: |
          docker run -d --name gnomock \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -p 23042:23042 \
            orlangure/gnomock:amd64
          timeout 60 bash -c 'until curl -s -o /dev/null localhost:23042; do sleep 1; done'
      - name: Setup postgres
        run: |
          curl -fsS localhost:23042/start/postgres -d '{
            "options": {
              "custom_named_ports": {
                "default": {"protocol": "tcp", "port": 5432, "host_port": 15432}
              },
              "debug": true
            }
          }'

      - name: Connect 1
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

      - name: Connect 2
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

      - name: Connect 3
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

      - name: Gnomock server logs
        if: always()
        run: docker logs gnomock

  build-images:
    name: "[core] images (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build server image
        run: task --force gnomock:build:server:${{ matrix.arch }}
      - name: Build cleaner image
        run: task --force gnomock:build:cleaner:${{ matrix.arch }}

  test-preset:
    name: "[preset] ${{ matrix.preset }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: localstack, server: TestLocalstack}
          - {preset: elastic, server: TestElastic}
          - {preset: memcached, server: TestMemcached}
          - {preset: rabbitmq, server: TestRabbitMQ}
          - {preset: kafka, server: TestKafka}
          - {preset: postgres, server: TestPostgres}
          - {preset: mariadb, server: TestMariaDB}
          - {preset: splunk, server: TestSplunk}
          - {preset: redis, server: TestRedis}
          - {preset: mysql, server: TestMySQL}
          - {preset: mssql, server: TestMSSQL}
          - {preset: mongo, server: TestMongo}
          - {preset: k3s, server: TestK3s}
          - {preset: cockroachdb, server: TestCockroachDB}
          - {preset: influxdb, server: TestInfluxDB}
          - {preset: cassandra, server: TestCassandra}
          - {preset: azurite, server: TestAzurite}
          - {preset: vault, server: TestVault}
          ### preset tests go here
    runs-on: ubuntu-latest
    env:
      # Only the localstack entry gets the token (used by the 2026.x test).
      LOCALSTACK_AUTH_TOKEN: ${{ matrix.preset == 'localstack' && secrets.LOCALSTACK_AUTH_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: "TEMPORARY: mssql startup diagnostics"
        if: matrix.preset == 'mssql'
        continue-on-error: true
        run: |
          start() { n=$1; shift; docker run -d --name "$n" "$@" >/dev/null; }
          start a-sa2025 -e ACCEPT_EULA=Y -e 'SA_PASSWORD=Gn0m!ck~' -p 1433 mcr.microsoft.com/mssql/server:2025-latest
          start b-msa2025 -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=Gn0m!ck~' -p 1433 mcr.microsoft.com/mssql/server:2025-latest
          start c-sa2022 -e ACCEPT_EULA=Y -e 'SA_PASSWORD=Gn0m!ck~' -p 1433 mcr.microsoft.com/mssql/server:2022-latest
          start d-sa2019 -e ACCEPT_EULA=Y -e 'SA_PASSWORD=Gn0m!ck~' -p 1433 mcr.microsoft.com/mssql/server:2019-latest
          sleep 30
          for n in a-sa2025 b-msa2025 c-sa2022 d-sa2019; do
            echo "=== $n"; docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$n"
            docker logs "$n" 2>&1 | head -15
          done
          docker rm -f a-sa2025 b-msa2025 c-sa2022 d-sa2019 >/dev/null
      - name: Test preset
        run: go test -race -v ./preset/${{ matrix.preset }}/...
      - name: Test server
        run: go test -race -v ./internal/gnomockd -run ${{ matrix.server }}
