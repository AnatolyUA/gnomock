name: Test
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: "[core] lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=10m
      - name: Vet for arm64
        run: GOARCH=arm64 go vet ./...

  test-core:
    name: "[core] gnomock, gnomockd (go ${{ matrix.go }})"
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Get dependencies
        run: go mod download
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Gnomock
        run: task test:core:gnomock
      - name: Test gnomockd
        run: task test:core:gnomockd
      - name: Test internal
        run: task test:core:internal

  test-arm64:
    name: "[arm64] core, postgres, mysql, redis, mongo"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Gnomock
        run: task test:core:gnomock
      - name: Test gnomockd
        run: task test:core:gnomockd
      - name: Test internal
        run: task test:core:internal
      - name: Test presets
        run: go test -race -v ./preset/postgres/... ./preset/mysql/... ./preset/redis/... ./preset/mongo/...
      - name: Test server
        run: go test -race -v ./internal/gnomockd -run '^(TestPostgres|TestMySQL|TestRedis|TestMongo)'

  test-github-action:
    name: "[core] github action"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build orlangure/gnomock image
        run: task gnomock:build:server
      - name: Start Gnomock server
        uses: gnomock/github-action@master
      - name: Test Gnomock connection
        run: curl localhost:23042/stop -d '{"id":"42"}'

  test-service-containers:
    name: "[core] service container"
    runs-on: ubuntu-latest
    services:
      gnomock:
        image: orlangure/gnomock:v0.20.0
        options: -v /var/run/docker.sock:/var/run/docker.sock
        ports:
        - 23042:23042
    steps:
      - name: Setup postgres
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> /home/runner/.bash_profile
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install httpie
          http --ignore-stdin -v :23042/start/postgres options[custom_named_ports][default][protocol]=tcp options[custom_named_ports][default][port]:=5432 options[custom_named_ports][default][host_port]:=15432 options[debug]:=true

      - name: Connect 1
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

      - name: Connect 2
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

      - name: Connect 3
        run: PGPASSWORD=password psql -h 127.0.0.1 -U postgres -p 15432 -c "select 1;"

  test-preset:
    name: "[preset] ${{ matrix.preset }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: localstack, server: TestLocalstack}
          - {preset: elastic, server: TestElastic}
          - {preset: memcached, server: TestMemcached}
          - {preset: rabbitmq, server: TestRabbitMQ}
          - {preset: kafka, server: TestKafka}
          - {preset: postgres, server: TestPostgres}
          - {preset: mariadb, server: TestMariaDB}
          - {preset: splunk, server: TestSplunk}
          - {preset: redis, server: TestRedis}
          - {preset: mysql, server: TestMySQL}
          - {preset: mssql, server: TestMSSQL}
          - {preset: mongo, server: TestMongo}
          - {preset: k3s, server: TestK3s}
          - {preset: cockroachdb, server: TestCockroachDB}
          - {preset: influxdb, server: TestInfluxDB}
          - {preset: cassandra, server: TestCassandra}
          - {preset: azurite, server: TestAzurite}
          - {preset: vault, server: TestVault}
    runs-on: ubuntu-latest
    env:
      # Only the localstack entry gets the token (used by the 2026.x test).
      LOCALSTACK_AUTH_TOKEN: ${{ matrix.preset == 'localstack' && secrets.LOCALSTACK_AUTH_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Test preset
        run: go test -race -v ./preset/${{ matrix.preset }}/...
      - name: Test server
        run: go test -race -v ./internal/gnomockd -run ${{ matrix.server }}
