version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - errorlint
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - wsl_v5
  settings:
    goconst:
      # goconst >= 1.8 also counts struct/map/slice literal values. Repeated
      # literals in test tables and Kubernetes manifests read better inline,
      # so keep the v1 scope. Call is the default exclusion.
      exclude-types:
        - Call
        - CompositeLit
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - linters:
          - bodyclose
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - godot
        path: cmd/server/presets.go
      - linters:
          - godot
        path: internal/testutil/preset.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
